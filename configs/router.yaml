features:
  text_encoder: BAAI/bge-m3
  image_encoder: google/siglip2-base-patch16-224
  frozen: true
  reference_aggregation: mean
probe_bank:
  size: 512
  selection: task_and_reference_count_stratified
  quality_independent: true
retrieval:
  top_k: 32
  temperature: 0.1
qpr:
  projection_dim: 128
  hidden_dim: 256
  correction_bound: 1.0
training:
  seeds: [20260917, 20260918, 20260919]
  batch_size: 192
  utility_epochs: 5
  routing_epochs: 20
  utility_learning_rate: 0.0003
  routing_learning_rate: 0.00015
  weight_decay: 0.001
  ranking_weight: 0.2
  prior_weight: 0.02
  utility_weight: 0.1
  decision_temperature: 0.03
  ranking_margin: 0.03
selection:
  validation_metric: quality_cost_score
  quality_tolerance: 0.03

