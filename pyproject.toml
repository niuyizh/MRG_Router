[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrg-router"
version = "1.0.0"
description = "Pre-rendering routing via capability probes for multi-reference image generation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "torch>=2.1",
]

[project.optional-dependencies]
features = ["Pillow>=9.5", "transformers>=4.48"]
test = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
